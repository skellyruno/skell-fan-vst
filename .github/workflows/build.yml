name: Build SkellFan
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, fix/skellfan-controls-20261114]

# One active draft-branch build at a time; main, production, release and
# manually dispatched validations are never superseded or cancelled.
concurrency:
  group: skellfan-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/release' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source consistency checks
        run: python tests/test_source.py
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP and portable regression tests
        run: ctest --test-dir build -C Release --output-on-failure -V
      - uses: actions/upload-artifact@v6
        with:
          name: SkellFan-UI-Snapshots
          path: build/SkellFan-ui-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "SkellFan.vst3" | Select-Object -First 1
          if (-not $vst) { throw "SkellFan.vst3 bundle not found" }
          $binary = Join-Path $vst.FullName "Contents/x86_64-win/SkellFan.vst3"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected Windows x64 VST3 binary missing from bundle"
          }
          $standalone = Get-ChildItem build -Recurse -File -Filter "SkellFan.exe" | Select-Object -First 1
          if (-not $standalone) { throw "SkellFan.exe standalone executable not found" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if ($standalone) { Copy-Item $standalone.FullName package/ }
          # JUCE 8's generated moduleinfo.json contains dangling commas.
          # Keep the exact VST3 identity, but normalize into strict JSON
          # before releasing any VST3 bundle to producers/FL Studio.
          python tests/normalize_moduleinfo.py "package/SkellFan.vst3/Contents/Resources/moduleinfo.json"
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellFan-Windows
          path: package/
