name: Build BreezeMod
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Source consistency checks
        run: python tests/test_source.py
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP and portable regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 and Standalone
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "BreezeMod.vst3" | Select-Object -First 1
          if (-not $vst) { throw "BreezeMod.vst3 bundle not found" }
          $standalone = Get-ChildItem build -Recurse -File -Filter "BreezeMod.exe" | Select-Object -First 1
          if (-not $standalone) { throw "BreezeMod.exe standalone executable not found" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Recurse $vst.FullName package/
          if ($standalone) { Copy-Item $standalone.FullName package/ }
          Compress-Archive package/* BreezeMod-Windows.zip
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: BreezeMod-Windows
          path: BreezeMod-Windows.zip
